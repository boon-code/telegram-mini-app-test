<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1"
    >

    <title>Telegram Mini App</title>

    <!-- Telegram Mini App JavaScript API -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: system-ui, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .counter {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
        }

        .counter button {
            width: 72px;
            height: 56px;
            padding: 0;
            margin: 0;
            border: 0;
            border-radius: 10px;
            font-size: 24px;
            cursor: pointer;

            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        #count {
            min-width: 48px;
            margin: 0;
            text-align: center;
            font-size: 32px;
            font-variant-numeric: tabular-nums;
        }

        .send-button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: 0;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;

            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Hello Mini App 👋</h1>

    <p id="user"></p>

    <div class="counter">
        <button id="decrement" type="button" aria-label="Decrease count">-1</button>
        <p id="count" aria-live="polite">0</p>
        <button id="increment" type="button" aria-label="Increase count">+1</button>
    </div>
    <button id="send" class="send-button" type="button">Send value to bot</button>
    <p id="send-status" aria-live="polite"></p>
</div>

<script>
    // Telegram.WebApp becomes available after telegram-web-app.js loads.
    const webApp = window.Telegram.WebApp;

    // Tell Telegram that the Mini App is ready.
    webApp.ready();

    // Expand the Mini App to use the available space.
    webApp.expand();

    // The user information is available when Telegram provides it.
    const user = webApp.initDataUnsafe?.user;

    if (user) {
        document.getElementById("user").textContent =
            `Hello, ${user.first_name}!`;
    }

    let count = 0;
    const countDisplay = document.getElementById("count");

    function updateCount(change) {
        count += change;
        countDisplay.textContent = count;
    }

    document.getElementById("decrement").addEventListener("click", () => {
        updateCount(-1);
    });

    document.getElementById("increment").addEventListener("click", () => {
        updateCount(1);
    });

    document.getElementById("send").addEventListener("click", () => {
	webApp.sendData(`counter:${count}\nbla bla`)
    });
</script>
</body>
</html>
